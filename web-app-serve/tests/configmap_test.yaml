suite: configmap
templates:
  - templates/configmap.yaml
set:
  image.name: ghcr.io/toggle-corp/org/web-app
  image.tag: v1.2.3
tests:
  - it: renders env values as string data
    set:
      env:
        APP_TITLE: My APP
        APP_ENVIRONMENT: ALPHA
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.APP_TITLE
          value: "My APP"
      - equal:
          path: data.APP_ENVIRONMENT
          value: "ALPHA"

  - it: renders an empty data block when no env is provided
    asserts:
      - isNullOrEmpty:
          path: data
