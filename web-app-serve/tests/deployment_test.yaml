suite: deployment
# configmap.yaml is included for the checksum annotation, so it must be loaded too;
# each test scopes its assertions to the Deployment document.
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml
set:
  image.name: ghcr.io/toggle-corp/org/web-app
  image.tag: v1.2.3
tests:
  - it: renders a Deployment with the composed image reference
    template: templates/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/toggle-corp/org/web-app:v1.2.3
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent

  - it: omits replicas when replicaCount is unset
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.replicas

  - it: sets replicas when replicaCount is defined
    template: templates/deployment.yaml
    set:
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: exposes the configured container port
    template: templates/deployment.yaml
    set:
      container.port: 8080
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080

  - it: wires envFrom to the configmap
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: RELEASE-NAME-web-app-serve-helm-configmap

  - it: sets a configmap checksum annotation to trigger rollouts
    template: templates/deployment.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/configmap"]

  - it: fails when image.name is missing
    template: templates/deployment.yaml
    set:
      image.name: null
    asserts:
      - failedTemplate:
          errorMessage: .Values.image.name

  - it: fails when image.tag is missing
    template: templates/deployment.yaml
    set:
      image.tag: null
    asserts:
      - failedTemplate:
          errorMessage: .Values.image.tag

  - it: renders imagePullSecrets from a list of maps
    template: templates/deployment.yaml
    set:
      image.pullSecrets:
        - name: ghcr-creds
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: ghcr-creds

  - it: renders imagePullSecrets from a list of strings
    template: templates/deployment.yaml
    set:
      image.pullSecrets:
        - ghcr-creds
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: ghcr-creds

  - it: omits imagePullSecrets when none are set
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: injects secrets via envFrom.secretRef
    template: templates/deployment.yaml
    set:
      envFromSecrets:
        - my-app-secrets
        - name: extra-secrets
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: RELEASE-NAME-web-app-serve-helm-configmap
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].secretRef.name
          value: my-app-secrets
      - equal:
          path: spec.template.spec.containers[0].envFrom[2].secretRef.name
          value: extra-secrets

  - it: only mounts the configmap when no envFromSecrets are set
    template: templates/deployment.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].envFrom
          count: 1
